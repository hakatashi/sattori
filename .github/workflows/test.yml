name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # ドキュメントのサイズ上限（docs/documentation-guidelines.md §6.1）。依存パッケージを
      # 使わないので install より前に置き、超過していれば真っ先に落ちるようにしてある。
      - name: Check documentation size
        run: pnpm check:docs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r worker/requirements-dev.txt

      - name: Test
        working-directory: worker
        run: pytest

  # 録画用MOD(*_hook.dll)がmingw-w64クロスビルドで壊れていないかの簡易確認。
  # 実機注入テストの代わりにはならない(.claude/skills/build-mods/SKILL.md)。
  mods-build-smoketest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build injector.exe (common)
        working-directory: worker/mods/common
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -O2 -o build/injector.exe injector.cpp \
            -static-libgcc -static-libstdc++

      - name: Build th06_hook.dll
        working-directory: worker/mods/th06_replay_autoplay
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -shared -O2 -o build/th06_hook.dll \
            dllmain.cpp ../common/dinput_hook.cpp ../common/window_wait.cpp \
            ../common/logging.cpp ../common/score_monitor.cpp \
            -luser32 -static-libgcc -static-libstdc++

      - name: Build th07_hook.dll
        working-directory: worker/mods/th07_replay_autoplay
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -shared -O2 -o build/th07_hook.dll \
            dllmain.cpp ../common/dinput_hook.cpp ../common/window_wait.cpp \
            ../common/logging.cpp ../common/score_monitor.cpp \
            -luser32 -static-libgcc -static-libstdc++

      - name: Build th08_hook.dll
        working-directory: worker/mods/th08_replay_autoplay
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -shared -O2 -o build/th08_hook.dll \
            dllmain.cpp ../common/dinput_hook.cpp ../common/window_wait.cpp \
            ../common/logging.cpp ../common/fps_monitor.cpp ../common/score_monitor.cpp \
            -luser32 -static-libgcc -static-libstdc++

      - name: Build th11_hook.dll
        working-directory: worker/mods/th11_replay_autoplay
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -shared -O2 -o build/th11_hook.dll \
            dllmain.cpp ../common/dinput_hook.cpp ../common/window_wait.cpp \
            ../common/logging.cpp ../common/fps_monitor.cpp ../common/score_monitor.cpp \
            -luser32 -static-libgcc -static-libstdc++

      - name: Build th20_hook.dll
        working-directory: worker/mods/th20_replay_autoplay
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -shared -O2 -o build/th20_hook.dll \
            dllmain.cpp ../common/dinput_hook.cpp ../common/window_wait.cpp \
            ../common/logging.cpp ../common/fps_monitor.cpp ../common/fps_limiter_hook.cpp \
            ../common/dsound_hook.cpp ../common/fps_display_hook.cpp ../common/score_monitor.cpp \
            -luser32 -static-libgcc -static-libstdc++ -static
