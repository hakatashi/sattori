name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      # ドキュメントのサイズ上限（docs/documentation-guidelines.md §6.1）。依存パッケージを
      # 使わないので install より前に置き、超過していれば真っ先に落ちるようにしてある。
      - name: Check documentation size
        run: pnpm check:docs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: pip install -r worker/requirements-dev.txt

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload Vitest results to BuildPulse
        if: always() && github.repository == 'hakatashi/sattori'
        uses: BuildPulseLLC/test-reporter-action@v3
        with:
          api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}
          path: "apps/*/junit.xml packages/*/junit.xml home-worker/junit.xml infra/junit.xml"
          coverage-files: "apps/*/coverage/lcov.info packages/*/coverage/lcov.info home-worker/coverage/lcov.info infra/coverage/lcov.info"

      - name: Upload Pytest results to BuildPulse
        if: always() && github.repository == 'hakatashi/sattori'
        uses: BuildPulseLLC/test-reporter-action@v3
        with:
          api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}
          path: worker/junit.xml
          coverage-files: worker/coverage.xml

  # 録画用MOD(*_hook.dll)がmingw-w64クロスビルドで壊れていないかの簡易確認。
  # 実機注入テストの代わりにはならない(.claude/skills/build-mods/SKILL.md)。
  mods-build-smoketest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build MODs and tools
        working-directory: worker/mods
        run: make -j$(nproc) all

