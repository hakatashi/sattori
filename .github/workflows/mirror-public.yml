name: Sync public mirror

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-public
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'hakatashi/sattori-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install git-filter-repo
        run: pip install git-filter-repo==2.47.0

      - name: Strip AI attribution trailers from commit messages
        run: |
          git filter-repo --force --message-callback '
          import re
          text = message.decode("utf-8", "replace")
          text = re.sub(r"\n?^Co-Authored-By:\s*Claude.*$", "", text, flags=re.MULTILINE | re.IGNORECASE)
          text = re.sub(r"\n?^Claude-Session:.*$", "", text, flags=re.MULTILINE | re.IGNORECASE)
          text = re.sub(r"\n{3,}", "\n\n", text)
          return text.rstrip("\n").encode("utf-8") + b"\n"
          '

      - name: Check history for forbidden paths
        run: |
          FORBIDDEN_REGEX='(^worker/games/|^worker/prefixes/|^worker/assets/|\.(wav|mp3|ogg|mp4|exe|dll|dat|zip|pem)$)'
          MATCHES=$(git log --all --diff-filter=A --name-only --pretty=format: | grep -v '^$' | grep -iE "$FORBIDDEN_REGEX" | sort -u || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::公開してはいけないパスが履歴に含まれているため push を中止しました:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan history for leaked secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Push filtered history to public mirror
        env:
          MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
        run: |
          git remote add public "https://x-access-token:${MIRROR_TOKEN}@github.com/hakatashi/sattori.git"
          git push --force public HEAD:main
