<!doctype html>
<!--
  日本語版(既定言語)のエントリHTML。英語版は `en/index.html` にほぼ同型のものがあり、
  両者は「言語依存のメタ情報だけが異なる同じSPA」である（片方にタグを足したらもう片方にも
  足すこと。`src/test/htmlMeta.test.ts` がタグ集合の一致を検証している）。

  クローラー(X/Discord/Slack等のunfurl bot)はJSを実行しないため、OGPはReact側からでは
  なくこの静的HTMLに焼く必要がある。どのURLでどちらのHTMLが配られるかはCloudFront
  Function側のルーティングで決まる（`infra/lib/sattori-stack.ts` の WebRouting）。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TouhouSattori - 東方リプレイ自動録画サービス</title>
    <meta
      name="description"
      content="東方Projectのリプレイファイルをアップロードするだけで、録画動画を自動生成できる無料サービスです。"
    />

    <link rel="alternate" hreflang="ja" href="https://sattori.hakatashi.com/" />
    <link rel="alternate" hreflang="en" href="https://sattori.hakatashi.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://sattori.hakatashi.com/" />

    <!-- OGP。ジョブページ(/jobs/{jobId})にも同じHTMLを配るため、ジョブ固有の情報は
         絶対に含めないこと（jobId自体が認可の秘密値であり、URLを貼った先の
         unfurl botがこのHTMLを取得しに来る）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TouhouSattori" />
    <meta property="og:url" content="https://sattori.hakatashi.com/" />
    <meta property="og:title" content="TouhouSattori - 東方リプレイ自動録画サービス" />
    <meta
      property="og:description"
      content="東方Projectのリプレイファイルをアップロードするだけで、録画動画を自動生成できる無料サービスです。"
    />
    <!-- og:imageは絶対URL必須。実体は `public/og-image-ja.jpg`(1200x630)。
         キャッチコピーを画像に焼いているため言語ごとに別ファイルになっている。 -->
    <meta property="og:image" content="https://sattori.hakatashi.com/og-image-ja.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TouhouSattori - 東方リプレイ自動録画サービス" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
