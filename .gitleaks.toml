title = "Sattori public mirror secret scan"

# 公開ミラー(.github/workflows/mirror-public.yml)へのpush前に、gitleaksの標準ルール
# (AWSキー・秘密鍵・genericなpassword/token代入など)へ、このリポジトリ固有の
# 漏洩パターンを追加する。Issue #137。

[extend]
useDefault = true

[[rules]]
id = "aws-arn-real-account-id"
description = "テスト用プレースホルダ(123456789012)ではない実アカウントIDを含むAWS ARN"
regex = '''arn:aws[a-zA-Z-]*:[a-z0-9-]*:[a-z0-9-]*:\d{12}:'''
tags = ["aws", "arn"]

[[rules]]
id = "private-ipv4-address"
description = "RFC1918プライベートIPv4アドレス(CIDR表記のネットワーク定義を除く)"
regex = '''\b(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})(?:/\d{1,2})?\b'''
tags = ["network", "private-ip"]

[rules.allowlist]
description = "VPCのCIDRブロック定義(infra)とテストのfixture値はネットワーク設計/合成データであり漏洩ではない"
regexTarget = "match"
regexes = [
  '''/\d{1,2}$''',
]
paths = [
  '''(?i)\.test\.(ts|py)$''',
]

[allowlist]
description = "テストやドキュメントで使うプレースホルダ値"
regexTarget = "match"
regexes = [
  '''123456789012''',
]
